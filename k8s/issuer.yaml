apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: flight-app-issuer
spec:
  acme:
    email: blessingtree.india@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: private-key
    solvers:
    - dns01:
        cloudDNS:
          project: project-cc1a23d4-810e-4fde-a2e
          serviceAccountSecretRef:
            name: dns-reslover-key
            key: key.json